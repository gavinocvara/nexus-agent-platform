name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tooling
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

      - name: Pytest
        run: python -m pytest

      - name: Validate scenario ground truth
        run: python -m nexus.lab.scenarios validate

  compose-integration:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ci-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build service images
        run: docker compose build

      - name: Start healthy environment
        run: docker compose up --detach --wait

      - name: Install integration test client
        run: python -m pip install -e ".[dev]"

      - name: Verify Gateway health
        run: curl --fail --show-error http://localhost:8000/health

      - name: Run PostgreSQL and incident lifecycle integration paths
        env:
          RUN_INTEGRATION: "1"
        run: python -m pytest -m integration tests/integration

      - name: Show service state
        if: always()
        run: docker compose ps

      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop environment
        if: always()
        run: docker compose down --volumes
