name: Resident Software Engineer

# Disabled by default. The job runs only when the repository variable
# NEXUS_SOFTWARE_ENGINEER_ENABLED is exactly "true". It never pushes: the workflow token
# is read-only, no GitHub write token is passed in (so the cycle can never publish), and
# the engineer's mode defaults to dry_run (observe, prioritize, plan, report). A Slack
# webhook is optional and lives only in a repository secret. Draft pull requests are
# opened by the owner running `python -m nexus.software_engineer decide` and `publish`.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run (default) or propose"
        required: false
        default: "dry_run"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  issues: read

concurrency:
  group: resident-software-engineer
  cancel-in-progress: false

jobs:
  engineering-cycle:
    if: ${{ vars.NEXUS_SOFTWARE_ENGINEER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXUS_SOFTWARE_ENGINEER_ENABLED: "true"
      NEXUS_SOFTWARE_ENGINEER_MODE: ${{ inputs.mode || vars.NEXUS_SOFTWARE_ENGINEER_MODE || 'dry_run' }}
      NEXUS_SOFTWARE_ENGINEER_OWNER_ID: ${{ vars.NEXUS_SOFTWARE_ENGINEER_OWNER_ID || 'owner' }}
      # The runner is ephemeral and holds no credentials beyond the read-only token, so
      # mechanical recipes may run as bounded local processes when the mode allows changes.
      NEXUS_SOFTWARE_ENGINEER_SANDBOX: ${{ vars.NEXUS_SOFTWARE_ENGINEER_SANDBOX || 'none' }}
      # Model recipes spend money only when the owner sets every one of these deliberately.
      NEXUS_SOFTWARE_ENGINEER_MODEL: ${{ vars.NEXUS_SOFTWARE_ENGINEER_MODEL }}
      NEXUS_SOFTWARE_ENGINEER_CONFIRM_MODEL_SPEND: ${{ vars.NEXUS_SOFTWARE_ENGINEER_CONFIRM_MODEL_SPEND || 'false' }}
      NEXUS_SOFTWARE_ENGINEER_MAX_MODEL_CALLS: ${{ vars.NEXUS_SOFTWARE_ENGINEER_MAX_MODEL_CALLS || '0' }}
      NEXUS_SOFTWARE_ENGINEER_MAX_OUTPUT_TOKENS: ${{ vars.NEXUS_SOFTWARE_ENGINEER_MAX_OUTPUT_TOKENS || '0' }}
      NEXUS_SOFTWARE_ENGINEER_MAX_COST_USD: ${{ vars.NEXUS_SOFTWARE_ENGINEER_MAX_COST_USD || '0' }}
      NEXUS_SOFTWARE_ENGINEER_MODEL_PRICE_INPUT_PER_MTOK: ${{ vars.NEXUS_SOFTWARE_ENGINEER_MODEL_PRICE_INPUT_PER_MTOK }}
      NEXUS_SOFTWARE_ENGINEER_MODEL_PRICE_OUTPUT_PER_MTOK: ${{ vars.NEXUS_SOFTWARE_ENGINEER_MODEL_PRICE_OUTPUT_PER_MTOK }}
      OPENAI_API_KEY: ${{ secrets.NEXUS_SOFTWARE_ENGINEER_OPENAI_API_KEY }}
      # Issue intake is read-only and opt-in; the workflow token has issues: read only.
      NEXUS_SOFTWARE_ENGINEER_READ_ISSUES: ${{ vars.NEXUS_SOFTWARE_ENGINEER_READ_ISSUES || 'false' }}
      NEXUS_SOFTWARE_ENGINEER_GITHUB_READ_TOKEN: ${{ github.token }}
      NEXUS_SOFTWARE_ENGINEER_SLACK_WEBHOOK_URL: ${{ secrets.NEXUS_SOFTWARE_ENGINEER_SLACK_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tooling
        run: python -m pip install -e ".[dev]"

      - name: Produce validation artifacts for inspection
        run: |
          mkdir -p artifacts/benchmark
          python -m ruff check . --output-format json > artifacts/ruff.json || true
          python -m mypy > artifacts/mypy.txt || true
          python -m pytest -q --junitxml=artifacts/pytest.xml || true
          python -m nexus.patchforge.e2e_catalog > artifacts/e2e.txt 2>&1 || true
          python -m nexus.patchforge.benchmark_corpus --output artifacts/benchmark > artifacts/benchmark.txt 2>&1 || true
          python -m nexus.sentinelqa > artifacts/sentinelqa.txt 2>&1 || true

      - name: Preflight
        run: python -m nexus.software_engineer preflight

      - name: Run one engineering cycle
        run: python -m nexus.software_engineer cycle --artifacts artifacts

      - name: Upload cycle record and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resident-engineer-cycle
          # The branch clone and evidence files let the owner run `publish` from a local
          # checkout after unpacking the artifact at the repository root.
          path: |
            .nexus/software_engineer/cycles
            .nexus/software_engineer/runs/*/*/candidate.patch
            .nexus/software_engineer/runs/*/*/patch_result.json
            .nexus/software_engineer/runs/*/*/sentinel_verdict.json
            .nexus/software_engineer/runs/*/*/engine_calls.json
            .nexus/software_engineer/runs/*/*/branch
            artifacts
          include-hidden-files: true
          retention-days: 30
