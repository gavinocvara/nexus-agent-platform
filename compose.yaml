name: nexus-aegisops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  users:
    build: .
    command:
      - uvicorn
      - nexus.services.users.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      NEXUS_ENV: development
      NEXUS_LOG_LEVEL: INFO
      NEXUS_LAB_FAILURES_ENABLED: "true"
      NEXUS_METRICS_ENABLED: "true"
      NEXUS_OTEL_ENABLED: "true"
      NEXUS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "8001:8000"

  orders:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn nexus.services.orders.app:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      NEXUS_ENV: development
      NEXUS_LOG_LEVEL: INFO
      NEXUS_LAB_FAILURES_ENABLED: "true"
      NEXUS_METRICS_ENABLED: "true"
      NEXUS_OTEL_ENABLED: "true"
      NEXUS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      NEXUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "8002:8000"

  gateway:
    build: .
    command:
      - uvicorn
      - nexus.services.gateway.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      NEXUS_ENV: development
      NEXUS_LOG_LEVEL: INFO
      NEXUS_METRICS_ENABLED: "true"
      NEXUS_OTEL_ENABLED: "true"
      NEXUS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      NEXUS_USERS_SERVICE_URL: http://users:8000
      NEXUS_ORDERS_SERVICE_URL: http://orders:8000
    depends_on:
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    ports:
      - "3000:3000"

  # NEXUS Command Center (ADR 0013): the read-only dashboard over NEXUS records. Opt-in
  # (profile), because it reads the host's .nexus state and must never create it: run
  #   mkdir -p .nexus/software_engineer .nexus/brain
  #   docker compose --profile command-center up -d
  # then open http://127.0.0.1:8765. It has no authentication, so the port binds loopback
  # only. It gets no secrets, no Docker socket, no write access, and only the two state
  # directories it reads, mounted read-only.
  command-center:
    profiles: ["command-center"]
    build:
      context: .
      dockerfile: web/command-center/Dockerfile
      args:
        PYTHON_IMAGE: ${NEXUS_COMMAND_CENTER_PYTHON_IMAGE:-python:3.12-slim}
    environment:
      NEXUS_COMMAND_CENTER_ENGINEER_STATE_ROOT: /nexus/software_engineer
      NEXUS_COMMAND_CENTER_ENGINEER_MEMORY_PATH: /nexus/software_engineer/memory.sqlite3
      NEXUS_COMMAND_CENTER_BRAIN_PATH: /nexus/brain/aegisops-investigator.sqlite3
      NEXUS_COMMAND_CENTER_SCENARIO_DIRECTORY: /app/lab/scenarios/v1
      NEXUS_COMMAND_CENTER_CLIENT_DIRECTORY: /app/web/command-center/dist
      # The engineer's environment (with its secrets) is never shared with this container.
      NEXUS_COMMAND_CENTER_ENGINEER_CONFIG_VISIBLE: "false"
      NEXUS_DIAGNOSTICS_GATEWAY_URL: http://gateway:8000
      NEXUS_DIAGNOSTICS_USERS_URL: http://users:8000
      NEXUS_DIAGNOSTICS_ORDERS_URL: http://orders:8000
      NEXUS_DIAGNOSTICS_PROMETHEUS_URL: http://prometheus:9090
      NEXUS_DIAGNOSTICS_LOKI_URL: http://loki:3100
      NEXUS_DIAGNOSTICS_TEMPO_URL: http://tempo:3200
    volumes:
      - type: bind
        source: ./.nexus/software_engineer
        target: /nexus/software_engineer
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.nexus/brain
        target: /nexus/brain
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz')
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:8765:8765"

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
