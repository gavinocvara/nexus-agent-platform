name: nexus-aegisops

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  users:
    build: .
    command:
      - uvicorn
      - nexus.services.users.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      NEXUS_ENV: development
      NEXUS_LOG_LEVEL: INFO
      NEXUS_LAB_FAILURES_ENABLED: "true"
      NEXUS_METRICS_ENABLED: "true"
      NEXUS_OTEL_ENABLED: "true"
      NEXUS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "8001:8000"

  orders:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn nexus.services.orders.app:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      NEXUS_ENV: development
      NEXUS_LOG_LEVEL: INFO
      NEXUS_LAB_FAILURES_ENABLED: "true"
      NEXUS_METRICS_ENABLED: "true"
      NEXUS_OTEL_ENABLED: "true"
      NEXUS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      NEXUS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      otel-collector:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "8002:8000"

  gateway:
    build: .
    command:
      - uvicorn
      - nexus.services.gateway.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      NEXUS_ENV: development
      NEXUS_LOG_LEVEL: INFO
      NEXUS_METRICS_ENABLED: "true"
      NEXUS_OTEL_ENABLED: "true"
      NEXUS_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4317
      NEXUS_USERS_SERVICE_URL: http://users:8000
      NEXUS_ORDERS_SERVICE_URL: http://orders:8000
    depends_on:
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./infra/observability/otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      tempo:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
      users:
        condition: service_healthy
      orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
